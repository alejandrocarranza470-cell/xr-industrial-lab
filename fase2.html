<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fase 2 - Modelo Industrial</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  <style>
    .back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Botón para volver al menú principal -->
  <a href="index.html" class="back-btn">← Volver al Menú</a>

  <a-scene>
    <!-- Piso industrial -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#333333"></a-plane>

    <!-- Banda transportadora (agrupada en un a-entity) -->
    <a-entity position="0 0.5 -3">
      <a-box position="0 0 0" width="4" height="0.3" depth="1" color="#555555"></a-box>
      <a-box position="-1.8 -0.4 0" width="0.2" height="0.5" depth="0.8" color="#222222"></a-box>
      <a-box position="1.8 -0.4 0" width="0.2" height="0.5" depth="0.8" color="#222222"></a-box>
      <a-cylinder position="-1.8 0.2 0" rotation="0 0 90" radius="0.15" height="0.9" color="#AAAAAA"></a-cylinder>
      <a-cylinder position="1.8 0.2 0" rotation="0 0 90" radius="0.15" height="0.9" color="#AAAAAA"></a-cylinder>
    </a-entity>

    <!-- Tanque de almacenamiento industrial con indicador/sensor -->
    <a-entity position="-3 1.25 -4">
      <a-cylinder position="0 0 0" radius="0.8" height="2.5" color="#0055A5"></a-cylinder>
      <a-sphere position="0 1.4 0" radius="0.2" color="#FF0000"></a-sphere>
    </a-entity>

    <!-- Panel de control de manufactura con botones -->
    <a-entity position="2.5 1 -2" rotation="0 -30 0">
      <a-box position="0 0 0" width="0.6" height="1.2" depth="0.3" color="#D4D4D4"></a-box>
      <a-sphere position="0 0.3 0.16" radius="0.08" color="#CC0000"></a-sphere>
      <a-sphere position="0 0.1 0.16" radius="0.05" color="#00FF00"></a-sphere>
    </a-entity>

    <a-sky color="#E0E0E0"></a-sky>
  </a-scene>
</body>
</html>
