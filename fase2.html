<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fase 2 - Celda Industrial Mejorada</title>
  <!-- Librería A-Frame según la guía -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  <style>
    .back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Botón de retorno al menú principal -->
  <a href="index.html" class="back-btn">← Volver al Menú</a>

  <a-scene>
    <a-sky color="#E8ECEF"></a-sky>

    <!-- ==================================================== -->
    <!-- PISO INDUSTRIAL Y DEMARCACIÓN DE SEGURIDAD -->
    <!-- ==================================================== -->
    <a-plane position="0 0 -3" rotation="-90 0 0" width="14" height="14" color="#3A3D40"></a-plane>
    <!-- Líneas amarillas de demarcación -->
    <a-plane position="0 0.01 -3" rotation="-90 0 0" width="10" height="0.1" color="#FFCC00"></a-plane>
    <a-plane position="0 0.01 -5.5" rotation="-90 0 0" width="10" height="0.1" color="#FFCC00"></a-plane>
    <a-plane position="-5 0.01 -4.25" rotation="-90 90 0" width="2.6" height="0.1" color="#FFCC00"></a-plane>
    <a-plane position="5 0.01 -4.25" rotation="-90 90 0" width="2.6" height="0.1" color="#FFCC00"></a-plane>

    <!-- ==================================================== -->
    <!-- BANDA TRANSPORTADORA DETALLADA -->
    <!-- ==================================================== -->
    <a-entity id="banda-transportadora" position="0 0 -4">

      <!-- 1. Cinta de la banda (Cinta continua) -->
      <a-box position="0 1 0" width="6" height="0.12" depth="1.2" color="#111111"></a-box>

      <!-- 2. Barandas laterales metálicas (Soporte azul) -->
      <a-box position="0 1.08 0.61" width="6.1" height="0.2" depth="0.05" color="#0055A5"></a-box>
      <a-box position="0 1.08 -0.61" width="6.1" height="0.2" depth="0.05" color="#0055A5"></a-box>

      <!-- 3. Rodillos giratorios en los extremos -->
      <a-cylinder position="-3 1 0" rotation="90 0 0" radius="0.18" height="1.2" color="#CCCCCC"></a-cylinder>
      <a-cylinder position="3 1 0" rotation="90 0 0" radius="0.18" height="1.2" color="#CCCCCC"></a-cylinder>

      <!-- 4. Patas de soporte con bases al piso -->
      <a-cylinder position="-2.5 0.5 0.5" radius="0.06" height="1" color="#444444"></a-cylinder>
      <a-box position="-2.5 0.02 0.5" width="0.3" height="0.04" depth="0.3" color="#222222"></a-box>

      <a-cylinder position="2.5 0.5 0.5" radius="0.06" height="1" color="#444444"></a-cylinder>
      <a-box position="2.5 0.02 0.5" width="0.3" height="0.04" depth="0.3" color="#222222"></a-box>

      <a-cylinder position="-2.5 0.5 -0.5" radius="0.06" height="1" color="#444444"></a-cylinder>
      <a-box position="-2.5 0.02 -0.5" width="0.3" height="0.04" depth="0.3" color="#222222"></a-box>

      <a-cylinder position="2.5 0.5 -0.5" radius="0.06" height="1" color="#444444"></a-cylinder>
      <a-box position="2.5 0.02 -0.5" width="0.3" height="0.04" depth="0.3" color="#222222"></a-box>

      <!-- Travesaños de refuerzo estructural -->
      <a-box position="-2.5 0.3 0" width="0.08" height="0.08" depth="1" color="#333333"></a-box>
      <a-box position="2.5 0.3 0" width="0.08" height="0.08" depth="1" color="#333333"></a-box>

      <!-- 5. Motor eléctrico de accionamiento -->
      <a-box position="2.7 0.6 -0.7" width="0.6" height="0.5" depth="0.5" color="#2B5B84"></a-box>
      <a-cylinder position="2.35 0.6 -0.7" rotation="0 0 90" radius="0.15" height="0.2" color="#888888"></a-cylinder>

      <!-- 6. Arco de inspección / Sensor sobre la línea -->
      <a-box position="0 1.8 0.6" width="0.1" height="1.4" depth="0.1" color="#FFCC00"></a-box>
      <a-box position="0 1.8 -0.6" width="0.1" height="1.4" depth="0.1" color="#FFCC00"></a-box>
      <a-box position="0 2.45 0" width="0.1" height="0.1" depth="1.3" color="#FFCC00"></a-box>
      <a-sphere position="0 2.45 0" radius="0.08" color="#00FF00"></a-sphere> <!-- LED Verde -->

      <!-- 7. Cajas / Cargas sobre la banda -->
      <a-box position="-1.8 1.25 0" width="0.6" height="0.4" depth="0.5" color="#D2B48C"></a-box>
      <a-box position="0 1.25 0" width="0.7" height="0.4" depth="0.6" color="#C08A3E"></a-box>
      <a-box position="1.6 1.25 0" width="0.5" height="0.4" depth="0.5" color="#D2B48C"></a-box>

    </a-entity>

    <!-- ==================================================== -->
    <!-- TANQUE DE ALMACENAMIENTO Y TUBERÍA -->
    <!-- ==================================================== -->
    <a-entity position="-4 0 -5">
      <a-cylinder position="0 2 0" radius="0.9" height="3" color="#0055A5"></a-cylinder>
      <a-sphere position="0 3.5 0" radius="0.9" color="#003366"></a-sphere>
      <a-cylinder position="0 0.25 0" radius="1" height="0.5" color="#222222"></a-cylinder>
      <a-sphere position="0 3.8 0" radius="0.15" color="#FF0000"></a-sphere>
      <a-cylinder position="1 2.5 0" rotation="0 0 90" radius="0.1" height="2" color="#A0A0A0"></a-cylinder>
    </a-entity>

    <!-- ==================================================== -->
    <!-- PANEL DE CONTROL E INTERFAZ HMI -->
    <!-- ==================================================== -->
    <a-entity position="3.8 0 -2.5" rotation="0 -35 0">
      <a-box position="0 0.6 0" width="0.2" height="1.2" depth="0.2" color="#333333"></a-box>
      <a-box position="0 1.3 0" width="0.8" height="0.9" depth="0.25" color="#D0D5DD"></a-box>
      <!-- Pantalla HMI -->
      <a-box position="0 1.45 0.13" width="0.5" height="0.35" depth="0.02" color="#0B192C"></a-box>
      <!-- Botón Paro de Emergencia -->
      <a-cylinder position="-0.25 1.15 0.15" rotation="90 0 0" radius="0.06" height="0.05" color="#CC0000"></a-cylinder>
      <!-- Botón Inicio -->
      <a-cylinder position="0 1.15 0.15" rotation="90 0 0" radius="0.05" height="0.05" color="#00A86B"></a-cylinder>
      <!-- Selector -->
      <a-cylinder position="0.25 1.15 0.15" rotation="90 0 0" radius="0.04" height="0.05" color="#0055A5"></a-cylinder>
    </a-entity>

  </a-scene>
</body>
</html>
