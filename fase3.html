<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fase 3 - Modelo CAD Integrado</title>
  <!-- Importación de la librería A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  <style>
    .back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Botón flotante para regresar al menú principal -->
  <a href="index.html" class="back-btn">← Volver al Menú</a>

  <a-scene>
    <!-- Carga previa del modelo 3D (Asset Management) -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Entorno visual: Cielo y piso industrial -->
    <a-sky color="#E8ECEF"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="14" height="14" color="#3A3D40"></a-plane>

    <!-- Renderizado e inserción del modelo CAD optimizado -->
    <a-entity gltf-model="#modeloIndustrial" position="0 0 -4" scale="1 1 1"></a-entity>
  </a-scene>
</body>
</html>
