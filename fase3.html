<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fase 3 - Modelo CAD Integrado (WebXR AR)</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  <style>
    .back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← Volver al Menú</a>

  <a-scene 
    webxr="optionalFeatures: hit-test; requiredFeatures: local-floor;" 
    ar-mode-ui="enabled: true" 
    renderer="alpha: true; colorManagement: true;">
    
    <!-- Carga del modelo en Assets -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Elementos virtuales ocultos en modo AR -->
    <a-sky color="#E8ECEF" hide-on-enter-ar></a-sky>
    <a-plane position="0 0 -3" rotation="-90 0 0" width="10" height="10" color="#3A3D40" hide-on-enter-ar></a-plane>
    
    <!-- Iluminación para asegurar visibilidad de texturas CAD -->
    <a-light type="ambient" color="#FFFFFF" intensity="1.5"></a-light>
    <a-light type="directional" position="-1 4 2" intensity="1.5"></a-light>

    <!-- Modelo CAD centrado frente al usuario -->
    <a-entity 
      gltf-model="#modeloIndustrial" 
      position="0 0 -2" 
      scale="1 1 1">
    </a-entity>
  </a-scene>
</body>
</html>
